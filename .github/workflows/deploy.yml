name: Deploy to cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          # 超时设置 10 秒,避免长时间挂起
          ssh-keyscan -T 10 -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>&1 || {
            echo "❌ ssh-keyscan 失败。请检查:"
            echo "  1. Secrets 是否已设置: SSH_HOST, SSH_PORT"
            echo "  2. 目标服务器 ${{ secrets.SSH_HOST }}:${{ secrets.SSH_PORT }} 是否可连接"
            echo "  3. 防火墙 / VPS 安全组是否开放该端口"
            exit 1
          }

      - name: Verify remote directory
        run: |
          echo "🔍 检查远程目录是否存在..."
          ssh -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "mkdir -p ~/public_html/dist && echo '✅ 目录已创建' && df -h ~ | tail -1"

      - name: Deploy via rsync over SSH
        run: |
          echo "📦 开始同步文件到 cPanel..."

          # Sync everything (除了开发文件) → public_html/
          # 只添加和更新文件，不删除服务器上的文件
          rsync -avz \
            --timeout=300 \
            --progress \
            --exclude 'node_modules/' \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'src/' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'vite.config.js' \
            --exclude '.env*' \
            --exclude '.gitignore' \
            --exclude '*.md' \
            --exclude '.vscode/' \
            --exclude '.idea/' \
            --exclude '.DS_Store' \
            --exclude 'worker/' \
            --exclude '.shared/' \
            --exclude 'blog/' \
            --exclude 'scripts/' \
            --exclude 'split/' \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o ServerAliveInterval=60 -o ServerAliveCountMax=3" \
            ./ \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:~/public_html/

          echo "✅ 部署完成!"
